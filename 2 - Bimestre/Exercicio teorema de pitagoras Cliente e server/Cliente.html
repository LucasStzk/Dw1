<!DOCTYPE html>
<html>

<head>
    <title>Enviar mensagens</title>
</head>

<body>
    <h1>Envie uma mensagem para o servidor</h1>
    <label for="enderecoServidorInput">Endereço do Servidor:</label>
    <input type="text" id="enderecoServidorInput" placeholder="Digite o endereço do servidor" value="localhost"><br><br>
    
    <label for="inputPorta">Porta:</label>
    <input type="text" id="inputPorta" placeholder="Digite a porta" value="3000"><br><br>
    <label for="inputMensagem">cateto 1:</label>
    <input type="number" id="inputCateto1" placeholder="Digite o valor do cateto 1"><br><br>
    <label for="inputMensagem">cateto 2:</label>
    <input type="number" id="inputCateto2" placeholder="Digite o valor do cateto 2"><br><br>
    <button onclick="enviarCatetos()">Enviar</button>
    <br>
    <br>
    <h3> Resposta do servidor</h3>
    <span id="respostaDoServidor">.....</span>    

    <script>
        async function enviarCatetos() {
            const cateto1 = document.getElementById('inputCateto1').value;
            const cateto2 = document.getElementById('inputCateto2').value;
            const enderecoServidor = document.getElementById('enderecoServidorInput').value;
            const porta = document.getElementById('inputPorta').value;
            try {
                const response = await fetch(`http://${enderecoServidor}:${porta}/calcular-hipotenusa`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ cateto1: parseFloat(cateto1), cateto2: parseFloat(cateto2) })
                });

                const data = await response.text();
                debugger
                document.getElementById("respostaDoServidor").innerHTML = data;
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro na comunicação com o servidor');
            }
        }
    </script>
</body>

</html>
